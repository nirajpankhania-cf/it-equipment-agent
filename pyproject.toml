[project]
name = "it-equipment-agent"
version = "0.1.0"
description = "MCP server and ReAct agent for handling IT equipment requests against mock policy data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "anthropic>=0.40",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equipment"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=src/equipment --cov-report=term-missing"
markers = ["integration: starts the real MCP server over stdio"]

[tool.coverage.run]
source = ["src/equipment"]
